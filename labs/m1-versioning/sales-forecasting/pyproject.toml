[project]
name = "m1-sales"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ghada Khedira", email = "khediraghada2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dvc[s3]>=3,<4",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.6",
    "mlflow>=3.18.0",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
m1-sales = "m1_sales:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
