[project]
name = "mlops-cours"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dvc[s3]>=3,<4",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.10.6",
    "mlflow>=3.18.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "scikit-learn>=1.9.1",
]

[project.scripts]
mlops-cours = "mlops_cours:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
